workflows:
  # ═══════════════════════════════════════════════════════════
  # 🤖 Android Build — AAB فقط (Google Play)
  # ═══════════════════════════════════════════════════════════
  android-workflow:
    name: Build AAB (Google Play)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      groups:
        - Noor Al-Haramain
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Create .env file
        script: |
          echo "$ENV_FILE" > $CM_BUILD_DIR/.env
          echo "✅ .env created"
          wc -c $CM_BUILD_DIR/.env

      - name: Decode keystore
        script: |
          mkdir -p $CM_BUILD_DIR/android/app
          echo "$KEYSTORE_BASE64" > /tmp/ks.b64
          base64 -di /tmp/ks.b64 > $CM_BUILD_DIR/android/app/noor-release.jks 2>/tmp/b64err.log || true
          cat /tmp/b64err.log
          ls -lh $CM_BUILD_DIR/android/app/noor-release.jks
          file $CM_BUILD_DIR/android/app/noor-release.jks

      - name: Create key.properties
        script: |
          cat > $CM_BUILD_DIR/android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=noor-release.jks
          EOF
          echo "✅ key.properties created"

      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Build AAB (for Google Play)
        script: |
          cd $CM_BUILD_DIR
          flutter build appbundle --release
          echo "✅ AAB created successfully"
          ls -lh $CM_BUILD_DIR/build/app/outputs/bundle/release/

    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - sly188218@gmail.com
        notify:
          success: true
          failure: true
