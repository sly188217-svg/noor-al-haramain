workflows:
  android-workflow:
    name: Build APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      groups:
        - Noor Al-Haramain
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Create .env file
        script: |
          echo "$ENV_FILE" > $CM_BUILD_DIR/.env
          echo "✅ .env created"
          wc -c $CM_BUILD_DIR/.env

      - name: Decode keystore
        script: |
          mkdir -p $CM_BUILD_DIR/android/app
          echo "$KEYSTORE_BASE64" > /tmp/ks.b64
          echo "=== حجم Base64 ==="
          wc -c /tmp/ks.b64
          echo "=== أول 20 حرف ==="
          head -c 20 /tmp/ks.b64
          echo ""
          echo "=== فك Base64 ==="
          base64 -di /tmp/ks.b64 > $CM_BUILD_DIR/android/app/noor-release.jks 2>/tmp/b64err.log || true
          cat /tmp/b64err.log
          echo "=== حجم Keystore ==="
          ls -lh $CM_BUILD_DIR/android/app/noor-release.jks
          echo "=== نوع الملف ==="
          file $CM_BUILD_DIR/android/app/noor-release.jks
          echo "=== أول 4 بايت ==="
          xxd $CM_BUILD_DIR/android/app/noor-release.jks | head -1
          echo "=== التحقق من المفتاح ==="
          keytool -list -keystore $CM_BUILD_DIR/android/app/noor-release.jks \
            -storepass "Noor2026Pass" \
            -alias "noor-key" 2>&1 || echo "⚠️ فشل"

      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --release

      - name: Verify APK
        script: |
          ls -lh $CM_BUILD_DIR/build/app/outputs/flutter-apk/
          file $CM_BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - sly188217@gmail.com
        notify:
          success: true
          failure: true
