workflows:
  android-workflow:
    name: Noor Al-Haramain Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    environment:
      flutter: stable
      java: 17
      android_signing:
        - noor_keystore
    
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    
    scripts:
      - name: Create .env file
        script: |
          echo "$ENV_FILE" > $CM_BUILD_DIR/.env
          echo "✅ .env created"
      
      - name: Create google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json
          echo "✅ google-services.json created"
      
      - name: Create key.properties
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/android/app/keystore.jks
          EOF
          echo "✅ key.properties created"
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Analyze code
        script: |
          flutter analyze || echo "⚠️ Analysis warnings only"
      
      - name: Build APK
        script: |
          flutter build apk --release
      
      - name: Build AAB (for Play Store)
        script: |
          flutter build appbundle --release
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
    
    publishing:
      email:
        recipients:
          - sly188217@gmail.com
        notify:
          success: true
          failure: true
