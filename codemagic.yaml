workflows:
  android-workflow:
    name: Build APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - Noor Al-Haramain
      vars:
        JAVA_HOME: "/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
    scripts:
      - name: Create .env file
        script: |
          echo "$ENV_FILE" > $CM_BUILD_DIR/.env
      - name: Create google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" > $CM_BUILD_DIR/android/app/google-services.json
      - name: Create keystore file
        script: |
          echo "$KEYSTORE_BASE64" | base64 -d > $CM_BUILD_DIR/android/app/keystore.p12
      - name: Create key.properties
        script: |
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=huiop1920
          keyPassword=huiop1920
          keyAlias=upload
          storeFile=$CM_BUILD_DIR/android/app/keystore.p12
          storeType=PKCS12
          EOF
      - name: Verify Java version
        script: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          which java
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - sly188217@gmail.com
        notify:
          success: true
          failure: true
