allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// ✅ الحل الجذري: إجبار جميع المكتبات على استخدام compileSdk 36
// هذا يحل مشكلة geocoding_android التي تستخدم compileSdk 33
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (compileSdkVersion == null || compileSdkVersion.toString().replace('android-', '') as int < 36) {
                    compileSdkVersion 36
                }
            }
        }
    }
}

// ✅ توحيد إصدارات Java و Kotlin
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '11'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
