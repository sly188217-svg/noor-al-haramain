allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// ✅ الحل الآمن: استخدام extensions.findByName بدلاً من afterEvaluate
// هذا يمنع خطأ "Cannot run Project.afterEvaluate when the project is already evaluated"
subprojects {
    if (project.extensions.findByName("android") != null) {
        Integer pluginCompileSdk = project.android.compileSdk
        if (pluginCompileSdk != null && pluginCompileSdk < 36) {
            project.logger.error(
                "Warning: Overriding compileSdk version in Flutter plugin: " +
                project.name +
                " from " + pluginCompileSdk + " to 36 (to work around https://issuetracker.google.com/issues/199180389)."
            )
            project.android {
                compileSdk 36
            }
        }
    }
}

// ✅ توحيد إصدارات Java و Kotlin
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '11'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
