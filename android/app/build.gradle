// ============================================================
// قراءة الإعدادات
// ============================================================
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    // في GitHub Actions، Flutter مثبت تلقائياً
    flutterRoot = System.getenv('FLUTTER_ROOT') ?: ''
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// ============================================================
// 🔐 قراءة بيانات التوقيع (اختياري)
// ============================================================
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ============================================================
// التحقق من وجود google-services.json
// ============================================================
def googleServicesFile = file('google-services.json')
def hasGoogleServices = googleServicesFile.exists()

// ============================================================
// Plugins
// ============================================================
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// تفعيل Firebase فقط إذا كان google-services.json موجوداً
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    println "✅ google-services.json موجود - تفعيل Firebase"
} else {
    println "⚠️ google-services.json غير موجود - تعطيل Firebase"
}

apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

// ============================================================
// إعدادات Android
// ============================================================
android {
    namespace "com.apexsec.noor_al_haramain_global"
    compileSdkVersion 35

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // ============================================================
    // الإعدادات الافتراضية
    // ============================================================
    defaultConfig {
        applicationId "com.apexsec.noor_al_haramain_global"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        resConfigs "ar", "en"
    }

    // ============================================================
    // 🔐 إعدادات التوقيع
    // ============================================================
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                // استخدام debug signing إذا لم يكن keystore موجوداً
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    // ============================================================
    // 🛡️ إعدادات البناء
    // ============================================================
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }

    // ============================================================
    // 🛡️ حماية إضافية
    // ============================================================
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/services/**',
                'META-INF/versions/**',
                'DebugProbesKt.bin',
            ]
        }
    }
}

// ============================================================
// Flutter
// ============================================================
flutter {
    source '../..'
}

// ============================================================
// التبعيات
// ============================================================
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.window:window-java:1.3.0'
}
