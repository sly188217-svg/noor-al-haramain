plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // ضروري لـ Firebase
}

// ⚠️ هذه السطور يجب أن تكون بعد كتلة plugins
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.apexsec.noor_al_haramain_global"
    compileSdkVersion 36 // ✅ تم التحديث ليتوافق مع المكتبات الحديثة
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11 // ✅ تم التعديل ليتوافق مع Kotlin
        targetCompatibility JavaVersion.VERSION_11 // ✅ تم التعديل ليتوافق مع Kotlin
    }

    kotlinOptions {
        jvmTarget = '11' // ✅ تم التعديل ليتوافق مع Java
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.apexsec.noor_al_haramain_global"
        minSdkVersion 24
        targetSdkVersion 36 // ✅ تم التحديث
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // 🔥 إضافة App Check Debug Token
        manifestPlaceholders["firebaseAppCheckDebugToken"] = "A0CD6B2F-9F70-4037-B04C-7C1D58CE299D"
    }

    buildTypes {
        release {
            // ⚠️ إذا كان لديك ملف keystore خاص، استبدل هذا السطر بإعدادات التوقيع الخاصة بك
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
}
