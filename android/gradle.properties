# ═══════════════════════════════════════════════════════════
# 📦 إعدادات Gradle — نور الحرمين
# ═══════════════════════════════════════════════════════════

# ✅ زيادة ذاكرة JVM (8 جيجا لـ R8 والتحويلات)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ✅ استخدام كل أنوية المعالج
org.gradle.parallel=true

# ✅ تفعيل التخزين المؤقت
org.gradle.caching=true

# ✅ تفعيل دايمون Gradle
org.gradle.daemon=true

# ✅ تعطيل R8 fullMode (أسرع + أقل مشاكل)
android.enableR8.fullMode=false

# ═══════════════════════════════════════════════════════════
# 🔧 حل تعارض R8 + shrinkResources
# ═══════════════════════════════════════════════════════════
android.nonFinalResIds=false
android.r8.optimizedResourceShrinking=false

# ═══════════════════════════════════════════════════════════
# ⚡ إعدادات الأداء الحاسمة
# ═══════════════════════════════════════════════════════════
# ✅ تعطيل Jetifier (نستخدم AndroidX فقط)
android.enableJetifier=false
android.useAndroidX=true

# ✅ تعطيل تحويل Jetify للـ JARs (السبب الرئيسي للمشكلة)
android.jetifier.blacklist=**/*.jar

# ✅ ضغط Kotlin
kotlin.incremental=true
kotlin.incremental.java=true

# ✅ تعطيل التحقق الصارم
android.suppressUnsupportedCompileSdk=36

# ═══════════════════════════════════════════════════════════
# 📊 ملاحظات
# ═══════════════════════════════════════════════════════════
# - Xmx8G = 8 جيجابايت لذاكرة JVM (كافية لـ R8)
# - enableJetifier=false = يوفر ~50% من الذاكرة
# - jetifier.blacklist = يمنع تحويل ملفات Flutter الضخمة
# ═══════════════════════════════════════════════════════════
