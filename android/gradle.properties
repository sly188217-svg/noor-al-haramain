## إعدادات ذاكرة Gradle (مهمة لبناء المشاريع الكبيرة)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

## دعم AndroidX (ضروري لجميع تطبيقات Flutter الحديثة)
android.useAndroidX=true
android.enableJetifier=true

## ⚠️ الحل الحاسم لمشكلة تعارض JVM Target
## هذا السطر يخبر Gradle بتجاهل التحقق الصارم من توافق الإصدارات
## مما يسمح لمكتبة flutter_timezone بالعمل دون أخطاء
kotlin.jvm.target.validation.mode=IGNORE
