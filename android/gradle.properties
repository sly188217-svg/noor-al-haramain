## إعدادات ذاكرة Gradle (مهمة لبناء المشاريع الكبيرة)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

## دعم AndroidX (ضروري لجميع تطبيقات Flutter الحديثة)
android.useAndroidX=true
android.enableJetifier=true

## ✅ الحل النهائي: تجاهل التحذير الخاص بمكتبة geocoding_android
## هذا يسمح بالبناء حتى لو كانت المكتبة تستخدم compileSdk 33
android.suppressUnsupportedCompileSdk=33

## (اختياري) تجاهل التحقق من توافق JVM Target
## قد يكون مفيداً إذا ظهرت مشاكل Java/Kotlin
kotlin.jvm.target.validation.mode=IGNORE
