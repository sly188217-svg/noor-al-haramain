# ═══════════════════════════════════════════════════════════
# 📦 إعدادات Gradle لتطبيق نور الحرمين
# ═══════════════════════════════════════════════════════════

# ✅ زيادة ذاكرة JVM لـ Gradle و R8
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# ✅ استخدام كل أنوية المعالج للبناء
org.gradle.parallel=true

# ✅ تفعيل التخزين المؤقت
org.gradle.caching=true

# ✅ تفعيل دايمون Gradle
org.gradle.daemon=true

# ✅ تعطيل R8 fullMode (أسرع + أقل مشاكل)
android.enableR8.fullMode=false

# ═══════════════════════════════════════════════════════════
# 🔧 حل تعارض R8 + shrinkResources
# ═══════════════════════════════════════════════════════════
# ✅ يجب أن يكون false لكي يعمل shrinkResources
android.nonFinalResIds=false

# ✅ تعطيل التحسين المتفائل للموارد (حل الخطأ)
android.r8.optimizedResourceShrinking=false

# ✅ ضغط Kotlin
kotlin.incremental=true
kotlin.incremental.java=true

# ✅ إعدادات AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ✅ تعطيل التحقق الصارم من إصدار SDK
android.suppressUnsupportedCompileSdk=36
