# ═══════════════════════════════════════════════════════════
# 📦 إعدادات Gradle لتطبيق نور الحرمين
# ═══════════════════════════════════════════════════════════

# ✅ زيادة ذاكرة JVM لـ Gradle و R8
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# ✅ استخدام كل أنوية المعالج للبناء
org.gradle.parallel=true

# ✅ تفعيل التخزين المؤقت
org.gradle.caching=true

# ✅ تفعيل دايمون Gradle (يبقى في الذاكرة)
org.gradle.daemon=true

# ✅ تعطيل ميزة R8 الكاملة (أسرع + أقل مشاكل)
android.enableR8.fullMode=false

# ✅ ضغط Kotlin
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true

# ✅ إعدادات إضافية لأداء أفضل
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ✅ تعطيل التحقق الصارم من الإصدارات
android.suppressUnsupportedCompileSdk=36

# ═══════════════════════════════════════════════════════════
# ⚠️ ملاحظات:
# - Xmx4G = 4 جيجابايت لذاكرة JVM
# - إذا كان جهازك بذاكرة أقل من 8 جيجا، غيّرها إلى 2G
# - enableR8.fullMode=false يقلل مشاكل التصغير
# ═══════════════════════════════════════════════════════════
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
