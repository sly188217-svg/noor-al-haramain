# ═══════════════════════════════════════════════════════════
# 📦 إعدادات Gradle — نور الحرمين
# ═══════════════════════════════════════════════════════════

# ✅ زيادة ذاكرة JVM (8 جيجا لـ R8 والتحويلات)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ✅ استخدام كل أنوية المعالج
org.gradle.parallel=true

# ✅ تفعيل التخزين المؤقت
org.gradle.caching=true

# ✅ تفعيل دايمون Gradle
org.gradle.daemon=true

# ✅ تعطيل R8 fullMode (أسرع + أقل مشاكل)
android.enableR8.fullMode=false

# ═══════════════════════════════════════════════════════════
# 🔧 حل تعارض R8 + shrinkResources
# ═══════════════════════════════════════════════════════════
android.nonFinalResIds=false
android.r8.optimizedResourceShrinking=false

# ═══════════════════════════════════════════════════════════
# ⚡ إعدادات الأداء الحاسمة
# ═══════════════════════════════════════════════════════════
# ✅ تعطيل Jetifier (نستخدم AndroidX فقط)
android.enableJetifier=false
android.useAndroidX=true

# ✅ تعطيل تحويل Jetify للـ JARs (السبب الرئيسي للمشكلة)
# ⚠️ ملاحظة: الاسم الجديد في AGP 7.0+ هو ignorelist
android.jetifier.ignorelist=**/*.jar

# ✅ ضغط Kotlin
kotlin.incremental=true
kotlin.incremental.java=true

# ✅ تعطيل التحقق الصارم
android.suppressUnsupportedCompileSdk=36
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
