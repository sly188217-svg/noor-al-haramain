name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Debug keystore secret
        run: |
          echo "=== حجم السر ==="
          echo -n "${{ secrets.KEYSTORE_BASE64 }}" | wc -c
          echo "=== أول 50 حرف ==="
          echo -n "${{ secrets.KEYSTORE_BASE64 }}" | head -c 50
          echo ""
          echo "=== آخر 50 حرف ==="
          echo -n "${{ secrets.KEYSTORE_BASE64 }}" | tail -c 50
          echo ""

      - name: Decode keystore (method 1)
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/ks.b64
          tr -d '\r\n \t' < /tmp/ks.b64 > /tmp/ks_clean.b64
          base64 -d /tmp/ks_clean.b64 > android/app/noor-release.jks
          ls -lh android/app/noor-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=noor-release.jks
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/noor-al-haramain.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "نور الحرمين - Build ${{ github.run_number }}"
          files: release/noor-al-haramain.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
