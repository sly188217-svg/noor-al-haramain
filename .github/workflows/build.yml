name: Build Flutter APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > assets/.env
          echo "✅ .env created"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/noor-release.jks
          ls -lh android/app/noor-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=noor-release.jks
          KEYEOF
          echo "✅ key.properties created"

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build APK (Split + Obfuscated)
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info/apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Build AAB (Obfuscated)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info/aab
          ls -lh build/app/outputs/bundle/release/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug Info
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/**
          retention-days: 30
