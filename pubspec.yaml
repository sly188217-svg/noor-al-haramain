name: noor_al_haramain_global
description: تطبيق نور الحرمين العالمي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══════════════════════════════════════════════════════════
  # 🔥 Firebase + AI Logic
  # ═══════════════════════════════════════════════════════════
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.2+10
  google_sign_in: ^6.3.0
  cloud_functions: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_analytics: ^11.6.0

  # ═══════════════════════════════════════════════════════════
  # 💳 الاشتراكات والدفع
  # ═══════════════════════════════════════════════════════════
  purchases_flutter: ^10.12.0

  # ═══════════════════════════════════════════════════════════
  # 🎤 تصحيح التلاوة والصوت
  # ═══════════════════════════════════════════════════════════
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.0.0
  audio_service: ^0.18.17
  permission_handler: ^11.4.0

  # ═══════════════════════════════════════════════════════════
  # 📖 المصحف والقرآن
  # ═══════════════════════════════════════════════════════════
  quran_kit: ^0.2.0
  qcf_quran: ^0.0.5

  # ═══════════════════════════════════════════════════════════
  # 📚 الحديث
  # ═══════════════════════════════════════════════════════════
  dorar_hadith: ^0.5.0

  # ═══════════════════════════════════════════════════════════
  # 📦 الأساسيات
  # ═══════════════════════════════════════════════════════════
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  intl: ^0.20.3
  http: ^1.3.0
  url_launcher: ^6.3.0

  # ═══════════════════════════════════════════════════════════
  # 📍 الموقع والبوصلة
  # ═══════════════════════════════════════════════════════════
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^7.1.0
  flutter_compass: ^0.8.0

  # ═══════════════════════════════════════════════════════════
  # 🔔 الإشعارات والوقت
  # ═══════════════════════════════════════════════════════════
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  hijri_date: ^1.1.0

  # ═══════════════════════════════════════════════════════════
  # 📺 الفيديو والتخزين
  # ═══════════════════════════════════════════════════════════
  youtube_player_iframe: ^4.0.4
  webview_flutter: ^4.9.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    # ═══════════════════════════════════════════════════════════
    # 📊 البيانات
    # ═══════════════════════════════════════════════════════════
    - assets/data/
    - assets/data/azkar.json
    - assets/data/fatwa_library.json
    - assets/data/quran_data.json
    - assets/data/quran_full.json

    # ═══════════════════════════════════════════════════════════
    # 🖼️ الصور والخلفيات
    # ═══════════════════════════════════════════════════════════
    - assets/images/
    - assets/images/flags/
    - assets/images/backgrounds/

    # ═══════════════════════════════════════════════════════════
    # 🎨 الأيقونة
    # ═══════════════════════════════════════════════════════════
    - assets/icon/

    # ═══════════════════════════════════════════════════════════
    # 🎵 الأذان المضمّن (3 مؤذنين)
    # ═══════════════════════════════════════════════════════════
    - assets/adhan/marwan/
    - assets/adhan/yasser/
    - assets/adhan/salah_budair/

    # ═══════════════════════════════════════════════════════════
    # 🔐 ملف .env
    # ═══════════════════════════════════════════════════════════
    - .env

# ═══════════════════════════════════════════════════════════
# 🎨 أيقونة التطبيق
# ═══════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B132B"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
