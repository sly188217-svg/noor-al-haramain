name: noor_al_haramain_global
description: تطبيق نور الحرمين العالمي - أوقات صلاة دقيقة، مصحف، أذكار، وبوصلة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== التخزين المحلي وإدارة الحالة =====
  shared_preferences: ^2.3.5
  provider: ^6.1.2

  # ===== التواريخ والتنسيق =====
  intl: ^0.20.3

  # ===== الموقع الجغرافي (GPS) وأوقات الصلاة =====
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.3.0

  # ===== التقويم الهجري الدقيق =====
  hijri_date: ^1.1.0

  # ===== تشغيل الصوت (للأذان والتلاوات) =====
  audioplayers: ^6.0.0
  audio_service: ^0.18.17

  # ===== الإشعارات المحلية والتشغيل الخلفي =====
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  android_alarm_manager_plus: ^4.0.3

  # ===== البوصلة ثلاثية الأبعاد =====
  sensors_plus: ^7.1.0
  flutter_compass: ^0.8.0

  # ===== 🔥 مزامنة حساب جوجل (Firebase) =====
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.2
  google_sign_in: ^6.2.2

  # ===== 📖 المصحف الشريف (قرآن كامل + تلاوات) =====
  quran_kit: ^0.2.0

  # ===== 📚 كتب السلف والأحاديث النبوية (API من دورر للحديث) =====
  dorar_hadith: ^0.5.0

  # ===== 🤖 الذكاء الاصطناعي (Gemini AI) =====
  google_generative_ai: ^0.4.7

  # ===== 🎤 الاستماع الصوتي والردود الصوتية =====
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # ===== فتح الروابط الخارجية =====
  url_launcher: ^6.3.0

  # ===== 📺 تشغيل البث المباشر داخل التطبيق =====
  youtube_player_flutter: ^8.0.0

  # ===== قاعدة البيانات (للتخزين المحلي للقرآن والأحاديث) =====
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # ===== دعم اللغة =====
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # ===== بيانات ثابتة (القرآن) =====
    - assets/data/
    - assets/data/quran_full.json

    # ===== صور الخلفيات (6 صور دينية) =====
    - assets/images/makkah.jpg
    - assets/images/madinah.jpg
    - assets/images/qubbah.jpg
    - assets/images/aqsa.jpg
    - assets/images/pattern1.jpg
    - assets/images/pattern2.jpg

    # ===== ملفات الأذان لكل مؤذن (12 مؤذناً) =====
    - assets/adhan/marwan/
    - assets/adhan/yasser/
    - assets/adhan/afasy/
    - assets/adhan/sudais/
    - assets/adhan/ali_jaber/
    - assets/adhan/ahmad_hajjim/
    - assets/adhan/basir_dosari/
    - assets/adhan/abdullah_juhani/
    - assets/adhan/abdullah_busfar/
    - assets/adhan/khalid_qahdani/
    - assets/adhan/salah_budair/
    - assets/adhan/husary/
